limitations:
- Dominio medido (atribuicao de falha em agentes multimodais de proposito geral) difere do
  dominio deste repositorio (validacao de camada de evidencia e testes de seguranca) - fonte,
  study_quality.scaffold acima; a sustentacao aqui e para o METODO de construcao de ground
  truth por mutacao unica, nao para o objeto medido pelo benchmark.
- A lista especifica de modelos avaliados e os numeros de desempenho de atribuicao por modelo
  nao foram conferidos nesta sessao alem do que o resumo declara em prosa - [nao verificado]
  nesta camada; esta entrada nao cita numeros de desempenho de atribuicao por modelo por essa
  razao.
- A validade do label-ouro depende da fidelidade do replay (cache deterministico mais
  checagem que aborta em divergencia, fonte - study_quality.baseline acima); os proprios
  autores documentam fontes de drift de ambiente (por exemplo rotacao diaria da estrutura de
  pagina de um motor de busca) que motivam esse mecanismo de aborto - ou seja, a garantia de
  "mudanca unica controlada" depende de um detector de drift cujos falsos negativos nao estao
  quantificados no trecho lido nesta sessao.
- Preprint sem confirmacao de revisao por pares nesta sessao (fonte - pagina abs, sem campo de
  comentario de submissao localizado, conferida nesta sessao).
