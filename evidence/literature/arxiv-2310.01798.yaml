applicability:
  domain_similarity: >-
    Alta - o mecanismo estudado (um modelo revisa a propria saida sem sinal externo) e
    exatamente o que a regra "auto-correcao sem sinal externo nao melhora e as vezes piora"
    deste repositorio evita ao delegar revisao a um agente com contexto separado ou a execucao
    real, em vez de a uma segunda passada do mesmo modelo sobre o mesmo contexto.
  scaffold_similarity: >-
    Nao verificado - o artigo mede modelos de linguagem em tarefas de raciocinio isoladas, nao
    um harness de engenharia de software com ferramentas; a proximidade de scaffold nao foi
    conferida nesta camada.
  oracle_similarity: >-
    Baixa - o oraculo do artigo e acuracia de resposta em tarefa de raciocinio, nao verificacao
    executavel de codigo.
inference_strength: SUPPORTED
inference_rationale: >-
  Peer-reviewed (fonte - identifier/citation acima) e a definicao central - auto-correcao
  intrinseca como tentativa de correcao baseada apenas na propria capacidade, sem o apoio de
  sinal externo - e diretamente
  aplicavel ao design de agente-revisor deste repositorio: um revisor que le a mesma resposta
  no mesmo contexto do autor compartilha pesos, contexto e amostragem, e portanto reproduz a
  condicao de auto-correcao intrinseca que o artigo mede como nao confiavel. A aplicabilidade
  do MECANISMO e alta; a aplicabilidade dos NUMEROS especificos de acuracia do artigo e mais
  fraca (dominio de raciocinio, nao SWE) e por isso nao foi reconferida aqui - o que sustenta
  SUPPORTED (mecanismo bem estabelecido, proximo) e nao DIRECT (nao mede este repositorio) nem
  EXTRAPOLATED (o mecanismo, ao contrario dos numeros, nao exige generalizacao alem do que foi
  demonstrado).
findings:
- metric: intrinsic_self_correction_definition
  value: >-
    "an LLM attempts to correct its initial responses based solely on its inherent
    capabilities, without the crutch of external feedback"
  source: "docs/method/CONHECIMENTO.md#2 (conferido na fonte primaria naquele documento)"
- metric: intrinsic_self_correction_result
  value: >-
    "LLMs struggle to self-correct their responses without external feedback, and at times,
    their performance even degrades after self-correction"
  source: "docs/method/CONHECIMENTO.md#2 (conferido na fonte primaria naquele documento)"
limitations:
- Dominio medido e raciocinio (tarefas tipo QA/matematica), nao engenharia de software; os
  numeros de acuracia especificos do artigo nao foram reconferidos por esta investigacao e nao
  estao listados em findings por essa razao.
- A citacao verbatim usada aqui foi conferida na fonte primaria em uma sessao anterior
  (registrada em docs/method/CONHECIMENTO.md), nao re-verificada nesta tarefa - reaproveitar
  uma citacao ja conferida no repositorio nao e o mesmo que conferi-la de novo, e essa
  distincao fica registrada aqui.
- Auto-correcao sem sinal externo e um mecanismo geral; nao mede especificamente revisao de
  codigo por agente com ferramentas, que e o caso de uso deste repositorio.
