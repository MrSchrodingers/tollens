claim_id: C-018
claim: 'Gate(P,a,r) <=> Applies(P,r) ^ Required(P) ^ not Bypass(a,P) e MEDIDA contra o endpoint
  autoritativo do GitHub (GET rules/branches/{branch} + GET rulesets/{id}), nao inferida do YAML
  dos workflows. Antes desta correcao a formula publicada, ExternalGate(P,a) <=> RequiredCheck(P)
  ^ not Bypass(a,P), nao tinha termo de aplicabilidade: o ruleset 20385799 podia estar
  `enforcement: active`, `bypass_actors: []`, exigindo `verify-pr`, e ainda assim
  `conditions.ref_name.include == []` fazia a regra se aplicar a ZERO refs sem que a formula
  denunciasse - o defeito era invisivel a uma leitura estatica dos arquivos deste repositorio.'
type: security-property
