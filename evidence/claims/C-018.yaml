  um campo JA LIDO pelo probe sem exigir um guard novo por campo - mas o schema so cobre os
  campos que o codigo LE hoje. Um campo novo introduzido por uma mudanca futura no probe (por
  exemplo, se ele passar a ler `conditions` do ruleset, ou `current_user_can_bypass` de uma regra
  `pull_request`) exigiria uma entrada de schema propria; `valida_campo` fecha a classe de formas
  invalidas de um campo ja declarado, nao adivinha campos que o codigo ainda nao le. Ver
  `limitations` para o que continua fora.

  ADENDO (wave5, 2026-08-11, achado do PORTAO FINAL sobre o diff de onda 4): O SEXTO CAMPO estava
  ANTES do schema, nao dentro dele - a mesma classe C1/A1/A2 fecharam para `ruleset_id`/
  `parameters`/`enforcement`, um passo mais cedo. `rsc = [r for r in rules if isinstance(r, dict)
