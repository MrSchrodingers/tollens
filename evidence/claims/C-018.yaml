  A correcao NAO adiciona um quinto guard: introduz `valida_campo`
  (evidence/probes/github-ruleset.py), um validador declarativo UNICO que distingue AUSENTE /
  NULO explicito / TIPO invalido / ELEMENTO invalido para qualquer campo das duas respostas,
  usado sistematicamente nos quatro pontos (`ruleset_id`, `parameters` e seus subcampos,
  `enforcement`, `bypass_actors` e seu elemento) em vez de um `if/elif` manual reescrito por
  campo a cada onda. A mesma doutrina foi estendida a `Required(P)`: uma regra
  `required_status_checks` aplicavel que nao pode ser lida por completo (`parameters`
  malformado, ou um item de `required_status_checks` que nao e objeto) agora produz
  NOT_VERIFIED, nunca mais `Required(P) = False` fabricado por omissao - o mesmo raciocinio de
  A2, aplicado a um termo que antes so tinha dois estados (medido-conforme / medido-violando) e
  passa a ter tres.

  `tests/unit/fronteira-viva.sh` ganhou V16 (C1), V17 (C2), V18 (A1), V19 (A2) e V20 - um QUINTO
  caso, distinto dos quatro acima (item de `required_status_checks` que nao e objeto), a prova de
  que o schema fecha uma FAMILIA e nao uma lista enumerada de campos - 78/78 verde.
  `tests/mutation/fronteira-viva.sh` reancorou MV1 e MV3 (o corpo mudou de `if/elif` manual para
  `valida_campo`; V9/MV3 tambem passaram a usar um ESCALAR, nao uma lista, como resposta
  malformada de rulesets/{id} - `valida_campo` usa `nome not in objeto`, que nao estoura para
